name: Build alpha exports

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 tools/validate_plan.py
      - run: python3 tools/pack.py validate
      - run: python3 tools/generate_quests.py --check
      - run: python3 -m unittest discover -s tests -v
      - run: python3 tools/pack.py build
      - uses: actions/upload-artifact@v4
        with:
          name: ATM-Omega-Edition-0.4.0-alpha.1
          path: dist/*
          if-no-files-found: error
